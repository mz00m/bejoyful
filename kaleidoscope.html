<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaleidoscope Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0c0c0f;
    --surface: #16161a;
    --border: #2a2a30;
    --text: #e8e6e3;
    --text-dim: #7f7f86;
    --accent: #b8a9f0;
    --accent-dim: rgba(184, 169, 240, 0.12);
  }

  html { background: var(--bg); color: var(--text); }

  body {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }

  h1 {
    font-size: 1.1rem;
    font-weight: 400;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 2.5rem;
  }

  h1 span { color: var(--accent); }

  /* Upload zone */
  #drop-zone {
    width: min(500px, 90vw);
    aspect-ratio: 1;
    border: 1.5px dashed var(--border);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.25s, background 0.25s;
    position: relative;
    overflow: hidden;
  }

  #drop-zone:hover, #drop-zone.drag-over {
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  #drop-zone.hidden { display: none; }

  #drop-zone svg {
    width: 48px;
    height: 48px;
    stroke: var(--text-dim);
    margin-bottom: 1.2rem;
    transition: stroke 0.25s;
  }

  #drop-zone:hover svg { stroke: var(--accent); }

  #drop-zone p {
    font-size: 0.95rem;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }

  #drop-zone p small {
    display: block;
    margin-top: 0.4rem;
    font-size: 0.78rem;
    opacity: 0.6;
  }

  #file-input { display: none; }

  /* Result area */
  #result { display: none; flex-direction: column; align-items: center; }
  #result.visible { display: flex; }

  #canvas-wrap {
    width: min(500px, 90vw);
    aspect-ratio: 1;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    background: var(--surface);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }

  #kaleidoscope {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Center crosshair overlay */
  #crosshair {
    position: absolute;
    width: 28px;
    height: 28px;
    border: 1.5px solid rgba(255,255,255,0.5);
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: opacity 0.2s;
    box-shadow: 0 0 12px rgba(0,0,0,0.4);
  }

  #crosshair::before, #crosshair::after {
    content: '';
    position: absolute;
    background: rgba(255,255,255,0.4);
  }

  #crosshair::before {
    width: 1px; height: 10px;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
  }

  #crosshair::after {
    width: 10px; height: 1px;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 0.6rem;
    margin-top: 1.5rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  button {
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    padding: 0.65rem 1.3rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 0.45rem;
  }

  button:hover {
    border-color: var(--accent);
    background: var(--accent-dim);
    color: #fff;
  }

  button.primary {
    background: var(--accent);
    color: #111;
    border-color: var(--accent);
  }

  button.primary:hover {
    background: #c9bcf5;
  }

  button svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Slider controls */
  .sliders {
    margin-top: 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
    width: min(500px, 90vw);
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }

  .slider-row label {
    font-size: 0.75rem;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    width: 70px;
    flex-shrink: 0;
  }

  input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: none;
  }

  input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: none;
  }

  /* Hint text */
  .hint {
    margin-top: 1rem;
    font-size: 0.75rem;
    color: var(--text-dim);
    opacity: 0.6;
    text-align: center;
  }

  /* Fade-in animation */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #result.visible {
    animation: fadeUp 0.5s ease-out;
  }

  /* Share bar */
  .share-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
    justify-content: center;
    width: min(500px, 90vw);
  }

  .share-label {
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    margin-right: 0.3rem;
  }

  .share-btn {
    font-family: inherit;
    font-size: 0.72rem;
    font-weight: 500;
    padding: 0.5rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }

  .share-btn:hover {
    border-color: var(--accent);
    color: #fff;
    background: var(--accent-dim);
  }

  .share-btn svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #share-x svg, #share-facebook svg, #share-pinterest svg {
    fill: currentColor;
    stroke: none;
  }

  .share-btn.copied {
    border-color: #6fcf97;
    color: #6fcf97;
  }
</style>
</head>
<body>

<h1><span>&#9670;</span> Kaleidoscope Maker</h1>

<!-- Upload -->
<div id="drop-zone">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="17 8 12 3 7 8"/>
    <line x1="12" y1="3" x2="12" y2="15"/>
  </svg>
  <p>Drop an image here or tap to upload<small>JPG, PNG, WebP</small></p>
</div>
<input type="file" id="file-input" accept="image/*">

<!-- Result -->
<div id="result">
  <div id="canvas-wrap">
    <canvas id="kaleidoscope" width="1080" height="1080"></canvas>
    <div id="crosshair"></div>
  </div>

  <div class="sliders">
    <div class="slider-row">
      <label>Center X</label>
      <input type="range" id="cx" min="0" max="100" value="50">
    </div>
    <div class="slider-row">
      <label>Center Y</label>
      <input type="range" id="cy" min="0" max="100" value="50">
    </div>
    <div class="slider-row">
      <label>Segments</label>
      <input type="range" id="segments" min="4" max="24" value="12" step="2">
    </div>
    <div class="slider-row">
      <label>Zoom</label>
      <input type="range" id="zoom" min="20" max="200" value="100">
    </div>
  </div>

  <div class="controls">
    <button id="btn-shuffle">
      <svg viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
      Shuffle
    </button>
    <button id="btn-new">
      <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      New Image
    </button>
    <button id="btn-download" class="primary">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download
    </button>
  </div>

  <p class="hint">Drag on the image to move the center point</p>

  <div class="share-bar">
    <span class="share-label">SHARE</span>
    <button class="share-btn" id="share-instagram" title="Save for Instagram">
      <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.5"/></svg>
      Instagram
    </button>
    <button class="share-btn" id="share-x" title="Share on X">
      <svg viewBox="0 0 24 24"><path d="M4 4l6.5 8L4 20h2l5.5-6.8L16 20h4l-7-8.5L19.5 4h-2L12.5 10 8 4H4z"/></svg>
      X
    </button>
    <button class="share-btn" id="share-facebook" title="Share on Facebook">
      <svg viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
      Facebook
    </button>
    <button class="share-btn" id="share-pinterest" title="Share on Pinterest">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 4.08 2.46 7.58 5.97 9.1-.08-.72-.16-1.84.03-2.63.17-.71 1.12-4.75 1.12-4.75s-.29-.57-.29-1.42c0-1.33.77-2.33 1.73-2.33.82 0 1.21.61 1.21 1.35 0 .82-.52 2.05-.79 3.19-.23.95.48 1.72 1.41 1.72 1.69 0 2.99-1.79 2.99-4.37 0-2.28-1.64-3.88-3.98-3.88-2.71 0-4.3 2.03-4.3 4.13 0 .82.31 1.69.71 2.17.08.09.09.18.07.27-.07.3-.24.95-.27 1.08-.04.18-.14.22-.33.13-1.24-.58-2.01-2.38-2.01-3.83 0-3.12 2.27-5.99 6.54-5.99 3.44 0 6.11 2.45 6.11 5.72 0 3.41-2.15 6.16-5.14 6.16-1 0-1.95-.52-2.27-1.14l-.62 2.35c-.22.87-.83 1.96-1.24 2.62.93.29 1.92.44 2.95.44 5.52 0 10-4.48 10-10S17.52 2 12 2z"/></svg>
      Pinterest
    </button>
    <button class="share-btn" id="share-copy" title="Copy image">
      <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copy
    </button>
  </div>
</div>

<script>
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const result = document.getElementById('result');
const canvas = document.getElementById('kaleidoscope');
const ctx = canvas.getContext('2d');
const crosshair = document.getElementById('crosshair');
const canvasWrap = document.getElementById('canvas-wrap');

const cxSlider = document.getElementById('cx');
const cySlider = document.getElementById('cy');
const segSlider = document.getElementById('segments');
const zoomSlider = document.getElementById('zoom');

let sourceImg = null;
let centerX = 0.5;
let centerY = 0.5;

// --- File handling ---

dropZone.addEventListener('click', () => fileInput.click());

dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('drag-over');
});

dropZone.addEventListener('dragleave', () => {
  dropZone.classList.remove('drag-over');
});

dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener('change', () => {
  if (fileInput.files.length) loadFile(fileInput.files[0]);
});

function loadFile(file) {
  if (!file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      sourceImg = img;
      centerX = 0.5;
      centerY = 0.5;
      cxSlider.value = 50;
      cySlider.value = 50;
      render();
      dropZone.classList.add('hidden');
      result.classList.add('visible');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// --- Kaleidoscope rendering ---

function render() {
  if (!sourceImg) return;

  const size = 1080;
  const numSegments = parseInt(segSlider.value);
  const zoom = parseInt(zoomSlider.value) / 100;

  ctx.clearRect(0, 0, size, size);

  const halfAngle = Math.PI / numSegments;
  const cx = size / 2;
  const cy = size / 2;
  const radius = size * 0.75;

  // Source sample region
  const srcCx = sourceImg.width * centerX;
  const srcCy = sourceImg.height * centerY;

  // Create a temporary canvas with the source wedge
  const tmp = document.createElement('canvas');
  const tmpCtx = tmp.getContext('2d');
  tmp.width = size;
  tmp.height = size;

  // Draw source image centered on the chosen point, scaled
  const scale = (size / Math.min(sourceImg.width, sourceImg.height)) * zoom;
  const drawW = sourceImg.width * scale;
  const drawH = sourceImg.height * scale;
  const drawX = cx - srcCx * scale;
  const drawY = cy - srcCy * scale;

  tmpCtx.drawImage(sourceImg, drawX, drawY, drawW, drawH);

  // Draw each segment
  for (let i = 0; i < numSegments; i++) {
    const angle = (2 * Math.PI / numSegments) * i;
    const mirrored = i % 2 === 1;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);

    if (mirrored) {
      ctx.scale(1, -1);
    }

    // Clip to wedge
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(radius * Math.cos(-halfAngle), radius * Math.sin(-halfAngle));
    ctx.arc(0, 0, radius, -halfAngle, halfAngle);
    ctx.closePath();
    ctx.clip();

    // Draw the source
    ctx.drawImage(tmp, -cx, -cy);

    ctx.restore();
  }

  // Subtle circular vignette
  const grad = ctx.createRadialGradient(cx, cy, size * 0.3, cx, cy, size * 0.52);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.25)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);

  updateCrosshair();
}

function updateCrosshair() {
  const rect = canvasWrap.getBoundingClientRect();
  crosshair.style.left = (centerX * 100) + '%';
  crosshair.style.top = (centerY * 100) + '%';
}

// --- Slider events ---

cxSlider.addEventListener('input', () => {
  centerX = cxSlider.value / 100;
  render();
});

cySlider.addEventListener('input', () => {
  centerY = cySlider.value / 100;
  render();
});

segSlider.addEventListener('input', () => render());
zoomSlider.addEventListener('input', () => render());

// --- Drag on canvas to move center ---

let dragging = false;

canvasWrap.addEventListener('pointerdown', e => {
  dragging = true;
  updateCenter(e);
  canvasWrap.setPointerCapture(e.pointerId);
});

canvasWrap.addEventListener('pointermove', e => {
  if (!dragging) return;
  updateCenter(e);
});

canvasWrap.addEventListener('pointerup', () => { dragging = false; });

function updateCenter(e) {
  const rect = canvasWrap.getBoundingClientRect();
  centerX = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  centerY = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
  cxSlider.value = centerX * 100;
  cySlider.value = centerY * 100;
  render();
}

// --- Buttons ---

document.getElementById('btn-shuffle').addEventListener('click', () => {
  centerX = 0.15 + Math.random() * 0.7;
  centerY = 0.15 + Math.random() * 0.7;
  cxSlider.value = centerX * 100;
  cySlider.value = centerY * 100;
  segSlider.value = [6, 8, 10, 12, 16, 20][Math.floor(Math.random() * 6)];
  zoomSlider.value = 60 + Math.random() * 100;
  render();
});

document.getElementById('btn-new').addEventListener('click', () => {
  sourceImg = null;
  result.classList.remove('visible');
  dropZone.classList.remove('hidden');
  fileInput.value = '';
});

document.getElementById('btn-download').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'kaleidoscope-1080x1080.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

// --- Share buttons ---

const shareText = 'Check out this kaleidoscope I made!';
const shareUrl = window.location.href;

// Instagram: download the image (Instagram doesn't have a web share API)
document.getElementById('share-instagram').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'kaleidoscope-instagram-1080x1080.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  const btn = document.getElementById('share-instagram');
  btn.textContent = 'Saved!';
  setTimeout(() => { btn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.5"/></svg> Instagram'; }, 2000);
});

// X (Twitter)
document.getElementById('share-x').addEventListener('click', () => {
  window.open(
    'https://x.com/intent/tweet?text=' + encodeURIComponent(shareText + ' ' + shareUrl),
    '_blank', 'width=550,height=420'
  );
});

// Facebook
document.getElementById('share-facebook').addEventListener('click', () => {
  window.open(
    'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(shareUrl),
    '_blank', 'width=550,height=420'
  );
});

// Pinterest
document.getElementById('share-pinterest').addEventListener('click', () => {
  const imgData = canvas.toDataURL('image/png');
  window.open(
    'https://pinterest.com/pin/create/button/?url=' + encodeURIComponent(shareUrl) + '&description=' + encodeURIComponent(shareText) + '&media=' + encodeURIComponent(imgData),
    '_blank', 'width=550,height=520'
  );
});

// Copy image to clipboard
document.getElementById('share-copy').addEventListener('click', async () => {
  try {
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    const btn = document.getElementById('share-copy');
    btn.classList.add('copied');
    btn.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Copied!';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy';
    }, 2000);
  } catch {
    alert('Could not copy — try downloading instead.');
  }
});

// Native Web Share API (mobile)
if (navigator.share && navigator.canShare) {
  const nativeBtn = document.createElement('button');
  nativeBtn.className = 'share-btn';
  nativeBtn.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg> More';
  nativeBtn.addEventListener('click', async () => {
    try {
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      const file = new File([blob], 'kaleidoscope.png', { type: 'image/png' });
      await navigator.share({ title: 'My Kaleidoscope', text: shareText, files: [file] });
    } catch {}
  });
  document.querySelector('.share-bar').appendChild(nativeBtn);
}
</script>
</body>
</html>
