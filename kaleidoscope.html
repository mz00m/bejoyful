<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaleidoscope Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet" crossorigin>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0c0c0f;
    --surface: #16161a;
    --border: #2a2a30;
    --text: #e8e6e3;
    --text-dim: #7f7f86;
    --accent: #b8a9f0;
    --accent-dim: rgba(184, 169, 240, 0.12);
  }

  html { background: var(--bg); color: var(--text); }

  body {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }

  h1 {
    font-size: 1.1rem;
    font-weight: 400;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 2.5rem;
  }

  h1 span { color: var(--accent); }

  /* Upload zone */
  #drop-zone {
    width: min(500px, 90vw);
    aspect-ratio: 1;
    border: 1.5px dashed var(--border);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.25s, background 0.25s;
    position: relative;
    overflow: hidden;
  }

  #drop-zone:hover, #drop-zone.drag-over {
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  #drop-zone.hidden { display: none; }

  #drop-zone svg {
    width: 48px;
    height: 48px;
    stroke: var(--text-dim);
    margin-bottom: 1.2rem;
    transition: stroke 0.25s;
  }

  #drop-zone:hover svg { stroke: var(--accent); }

  #drop-zone p {
    font-size: 0.95rem;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }

  #drop-zone p small {
    display: block;
    margin-top: 0.4rem;
    font-size: 0.78rem;
    opacity: 0.6;
  }

  #file-input { display: none; }

  /* Result area */
  #result { display: none; flex-direction: column; align-items: center; }
  #result.visible { display: flex; }

  #canvas-wrap {
    width: min(500px, 90vw);
    aspect-ratio: 1;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    background: var(--surface);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }

  #kaleidoscope {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Center crosshair overlay */
  #crosshair {
    position: absolute;
    width: 28px;
    height: 28px;
    border: 1.5px solid rgba(255,255,255,0.5);
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: opacity 0.2s;
    box-shadow: 0 0 12px rgba(0,0,0,0.4);
  }

  #crosshair::before, #crosshair::after {
    content: '';
    position: absolute;
    background: rgba(255,255,255,0.4);
  }

  #crosshair::before {
    width: 1px; height: 10px;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
  }

  #crosshair::after {
    width: 10px; height: 1px;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
  }

  /* Export overlay */
  #export-overlay {
    position: absolute;
    inset: 0;
    background: rgba(12, 12, 15, 0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  #export-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }

  #export-overlay .progress-ring {
    width: 64px;
    height: 64px;
    margin-bottom: 0.8rem;
  }

  #export-overlay .progress-ring circle {
    fill: none;
    stroke-width: 3;
  }

  #export-overlay .progress-ring .ring-bg {
    stroke: var(--border);
  }

  #export-overlay .progress-ring .ring-fg {
    stroke: var(--accent);
    stroke-linecap: round;
    transform: rotate(-90deg);
    transform-origin: center;
    transition: stroke-dashoffset 0.1s;
  }

  .export-percent {
    font-size: 1.1rem;
    color: var(--text);
    margin-bottom: 0.2rem;
  }

  .export-frames {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-bottom: 0.1rem;
  }

  .export-eta {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-bottom: 1rem;
  }

  .export-status {
    font-size: 0.82rem;
    color: var(--text-dim);
    margin-bottom: 1rem;
  }

  /* Export preview video */
  #export-preview {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
  }

  #export-overlay.preview-mode .progress-ring,
  #export-overlay.preview-mode .export-percent,
  #export-overlay.preview-mode .export-frames,
  #export-overlay.preview-mode .export-eta,
  #export-overlay.preview-mode .export-status,
  #export-overlay.preview-mode #btn-cancel-export {
    display: none;
  }

  #export-overlay.preview-mode #export-preview {
    display: block;
  }

  #export-overlay.preview-mode .export-actions {
    display: flex;
  }

  .export-actions {
    display: none;
    gap: 0.6rem;
    margin-top: 0.8rem;
    position: absolute;
    bottom: 2.2rem;
  }

  .export-hint {
    display: none;
    position: absolute;
    bottom: 0.6rem;
    font-size: 0.72rem;
    color: var(--text-dim);
    opacity: 0.6;
  }

  #export-overlay.preview-mode .export-hint {
    display: block;
  }

  /* Transport bar */
  .transport {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 1rem;
    width: min(500px, 90vw);
  }

  #btn-play {
    min-width: 44px;
    min-height: 44px;
    padding: 0.5rem 1rem;
  }

  /* Mood dropdown */
  .mood-wrap {
    position: relative;
    flex: 1;
  }

  #mood-select {
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    padding: 0.5rem 2rem 0.5rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    outline: none;
    transition: border-color 0.2s;
  }

  #mood-select:hover, #mood-select:focus {
    border-color: var(--accent);
  }

  #mood-select option {
    background: var(--surface);
    color: var(--text);
  }

  .mood-wrap::after {
    content: '\25BC';
    position: absolute;
    right: 0.8rem;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.6rem;
    color: var(--text-dim);
    pointer-events: none;
  }

  /* Speed slider (hidden until playing) */
  #speed-row {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.3s, opacity 0.3s;
  }

  #speed-row.visible {
    max-height: 40px;
    opacity: 1;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 0.6rem;
    margin-top: 1.5rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  button {
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    padding: 0.65rem 1.3rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 0.45rem;
  }

  button:hover {
    border-color: var(--accent);
    background: var(--accent-dim);
    color: #fff;
  }

  button:disabled {
    opacity: 0.4;
    pointer-events: none;
  }

  button.primary {
    background: var(--accent);
    color: #111;
    border-color: var(--accent);
    min-width: 44px;
    min-height: 44px;
  }

  button.primary:hover {
    background: #c9bcf5;
  }

  @keyframes gentlePulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(184, 169, 240, 0); }
    50% { box-shadow: 0 0 12px 4px rgba(184, 169, 240, 0.3); }
  }

  button.pulse {
    animation: gentlePulse 2s ease-in-out 1;
  }

  button svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Slider controls */
  .sliders {
    margin-top: 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
    width: min(500px, 90vw);
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }

  .slider-row label {
    font-size: 0.75rem;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    width: 80px;
    flex-shrink: 0;
  }

  input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: none;
  }

  input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: none;
  }

  /* Audio section */
  #audio-section {
    width: min(500px, 90vw);
    margin-top: 1rem;
  }

  #audio-drop-zone {
    width: 100%;
    padding: 1rem;
    border: 1.5px dashed var(--border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.25s, background 0.25s;
    min-height: 60px;
  }

  #audio-drop-zone:hover, #audio-drop-zone.drag-over {
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  #audio-drop-zone.hidden { display: none; }

  #audio-drop-zone p {
    font-size: 0.82rem;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }

  #audio-drop-zone p small {
    display: block;
    margin-top: 0.3rem;
    font-size: 0.72rem;
    opacity: 0.6;
  }

  #audio-file-input { display: none; }

  /* Audio connected state */
  #audio-info {
    display: none;
  }

  #audio-info.visible {
    display: block;
  }

  .audio-file-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.6rem;
  }

  .audio-filename {
    font-size: 0.82rem;
    color: var(--text);
  }

  .audio-status {
    font-size: 0.72rem;
    color: var(--text-dim);
  }

  #btn-remove-audio {
    font-size: 0.72rem;
    padding: 0.2rem 0.5rem;
    border-radius: 6px;
    margin-left: auto;
  }

  /* Waveform */
  #waveform {
    width: 100%;
    height: 24px;
    margin-top: 0.4rem;
    display: flex;
    align-items: flex-end;
    gap: 2px;
  }

  .waveform-bar {
    flex: 1;
    background: var(--accent);
    opacity: 0.7;
    min-height: 1px;
    border-radius: 1px;
    transition: height 0.05s;
  }

  /* Mic button */
  #btn-mic {
    font-size: 0.72rem;
    padding: 0.4rem 0.8rem;
    min-width: 44px;
    min-height: 44px;
  }

  #btn-mic.active {
    border-color: var(--accent);
    color: var(--accent);
  }

  .mic-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.5rem;
  }

  /* Export popover */
  #export-popover {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    z-index: 20;
    display: none;
    min-width: 220px;
  }

  #export-popover.visible {
    display: block;
  }

  .popover-label {
    font-size: 0.72rem;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 0.4rem;
  }

  .popover-label:not(:first-child) {
    margin-top: 0.8rem;
  }

  .pill-group {
    display: flex;
    gap: 0.3rem;
  }

  .pill {
    font-family: inherit;
    font-size: 0.75rem;
    font-weight: 500;
    padding: 0.35rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
  }

  .pill:hover {
    border-color: var(--accent);
    color: var(--text);
  }

  .pill.active {
    background: var(--accent);
    color: #111;
    border-color: var(--accent);
  }

  .popover-check {
    display: none;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.8rem;
    font-size: 0.78rem;
    color: var(--text-dim);
    cursor: pointer;
  }

  .popover-check.visible {
    display: flex;
  }

  .popover-check input[type="checkbox"] {
    accent-color: var(--accent);
  }

  #btn-start-export {
    margin-top: 0.8rem;
    width: 100%;
    justify-content: center;
  }

  /* Hint text */
  .hint {
    margin-top: 1rem;
    font-size: 0.75rem;
    color: var(--text-dim);
    opacity: 0.6;
    text-align: center;
  }

  /* Fade-in animation */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #result.visible {
    animation: fadeUp 0.5s ease-out;
  }

  /* Share bar */
  .share-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
    justify-content: center;
    width: min(500px, 90vw);
  }

  .share-label {
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    margin-right: 0.3rem;
  }

  .share-btn {
    font-family: inherit;
    font-size: 0.72rem;
    font-weight: 500;
    padding: 0.5rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }

  .share-btn:hover {
    border-color: var(--accent);
    color: #fff;
    background: var(--accent-dim);
  }

  .share-btn svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #share-x svg, #share-facebook svg, #share-pinterest svg {
    fill: currentColor;
    stroke: none;
  }

  .share-btn.copied {
    border-color: #6fcf97;
    color: #6fcf97;
  }

  /* Download button wrapper for popover positioning */
  .download-wrap {
    position: relative;
  }
</style>
</head>
<body>

<h1><span>&#9670;</span> Kaleidoscope Maker</h1>

<!-- Upload -->
<div id="drop-zone">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="17 8 12 3 7 8"/>
    <line x1="12" y1="3" x2="12" y2="15"/>
  </svg>
  <p>Drop an image here or tap to upload<small>JPG, PNG, WebP</small></p>
</div>
<input type="file" id="file-input" accept="image/*">

<!-- Result -->
<div id="result">
  <div id="canvas-wrap">
    <canvas id="kaleidoscope" width="1080" height="1080" role="img" aria-label="Kaleidoscope preview"></canvas>
    <div id="crosshair"></div>

    <!-- Export overlay -->
    <div id="export-overlay">
      <svg class="progress-ring" viewBox="0 0 64 64">
        <circle class="ring-bg" cx="32" cy="32" r="28"/>
        <circle class="ring-fg" cx="32" cy="32" r="28" stroke-dasharray="175.93" stroke-dashoffset="175.93"/>
      </svg>
      <div class="export-percent">0%</div>
      <div class="export-frames">0 / 0 frames</div>
      <div class="export-eta"></div>
      <div class="export-status"></div>
      <button id="btn-cancel-export">Cancel</button>
      <video id="export-preview" loop muted playsinline></video>
      <div class="export-actions">
        <button id="btn-download-video" class="primary">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download MP4
        </button>
        <button id="btn-new-export">New Export</button>
      </div>
      <p class="export-hint">Add audio in Instagram or TikTok.</p>
    </div>
  </div>

  <!-- Transport bar -->
  <div class="transport">
    <button id="btn-play" aria-label="Play animation">
      <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      Play
    </button>
    <div class="mood-wrap">
      <select id="mood-select" aria-label="Animation mood">
        <option value="meditative">Meditative</option>
        <option value="gentle" selected>Gentle</option>
        <option value="dramatic">Dramatic</option>
        <option value="psychedelic">Psychedelic</option>
      </select>
    </div>
  </div>

  <!-- Speed slider (progressive disclosure) -->
  <div class="sliders">
    <div class="slider-row" id="speed-row">
      <label>Speed</label>
      <input type="range" id="speed" min="10" max="200" value="100" aria-label="Animation speed" aria-valuetext="100%">
    </div>
    <div class="slider-row">
      <label>Center X</label>
      <input type="range" id="cx" min="0" max="100" value="50">
    </div>
    <div class="slider-row">
      <label>Center Y</label>
      <input type="range" id="cy" min="0" max="100" value="50">
    </div>
    <div class="slider-row">
      <label>Segments</label>
      <input type="range" id="segments" min="4" max="24" value="12" step="2">
    </div>
    <div class="slider-row">
      <label>Zoom</label>
      <input type="range" id="zoom" min="20" max="200" value="100">
    </div>
  </div>

  <!-- Audio section -->
  <div id="audio-section">
    <div id="audio-drop-zone">
      <p>Drop audio or tap to upload<small>MP3, WAV, AAC — max 20MB, 60s</small></p>
    </div>
    <input type="file" id="audio-file-input" accept="audio/*">

    <div id="audio-info">
      <div class="audio-file-row">
        <span class="audio-filename" id="audio-filename"></span>
        <span class="audio-status" id="audio-status"></span>
        <button id="btn-remove-audio">x</button>
      </div>
      <div class="slider-row">
        <label>Sensitivity</label>
        <input type="range" id="sensitivity" min="0" max="100" value="50" aria-label="Audio sensitivity">
      </div>
      <div id="waveform"></div>
    </div>

    <div class="mic-row">
      <button id="btn-mic" aria-label="Use microphone">
        <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        Use Mic
      </button>
    </div>
  </div>

  <div class="controls">
    <button id="btn-shuffle">
      <svg viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
      Shuffle
    </button>
    <button id="btn-new">
      <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      New Image
    </button>
    <div class="download-wrap">
      <button id="btn-download" class="primary" aria-label="Download">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download
      </button>
      <!-- Export popover -->
      <div id="export-popover">
        <div class="popover-label">Duration</div>
        <div class="pill-group" id="duration-pills">
          <button class="pill" data-val="3">3s</button>
          <button class="pill active" data-val="6">6s</button>
          <button class="pill" data-val="15">15s</button>
        </div>
        <div class="popover-label">Aspect</div>
        <div class="pill-group" id="aspect-pills">
          <button class="pill active" data-val="1:1">1:1</button>
          <button class="pill" data-val="9:16">9:16</button>
          <button class="pill" data-val="16:9">16:9</button>
        </div>
        <label class="popover-check" id="include-audio-check">
          <input type="checkbox" id="include-audio" checked>
          Include audio
        </label>
        <button id="btn-start-export" class="primary">Export</button>
      </div>
    </div>
  </div>

  <p class="hint">Drag on the image to move the center point</p>

  <div class="share-bar">
    <span class="share-label">SHARE</span>
    <button class="share-btn" id="share-instagram" title="Save for Instagram">
      <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.5"/></svg>
      Instagram
    </button>
    <button class="share-btn" id="share-x" title="Share on X">
      <svg viewBox="0 0 24 24"><path d="M4 4l6.5 8L4 20h2l5.5-6.8L16 20h4l-7-8.5L19.5 4h-2L12.5 10 8 4H4z"/></svg>
      X
    </button>
    <button class="share-btn" id="share-facebook" title="Share on Facebook">
      <svg viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
      Facebook
    </button>
    <button class="share-btn" id="share-pinterest" title="Share on Pinterest">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 4.08 2.46 7.58 5.97 9.1-.08-.72-.16-1.84.03-2.63.17-.71 1.12-4.75 1.12-4.75s-.29-.57-.29-1.42c0-1.33.77-2.33 1.73-2.33.82 0 1.21.61 1.21 1.35 0 .82-.52 2.05-.79 3.19-.23.95.48 1.72 1.41 1.72 1.69 0 2.99-1.79 2.99-4.37 0-2.28-1.64-3.88-3.98-3.88-2.71 0-4.3 2.03-4.3 4.13 0 .82.31 1.69.71 2.17.08.09.09.18.07.27-.07.3-.24.95-.27 1.08-.04.18-.14.22-.33.13-1.24-.58-2.01-2.38-2.01-3.83 0-3.12 2.27-5.99 6.54-5.99 3.44 0 6.11 2.45 6.11 5.72 0 3.41-2.15 6.16-5.14 6.16-1 0-1.95-.52-2.27-1.14l-.62 2.35c-.22.87-.83 1.96-1.24 2.62.93.29 1.92.44 2.95.44 5.52 0 10-4.48 10-10S17.52 2 12 2z"/></svg>
      Pinterest
    </button>
    <button class="share-btn" id="share-copy" title="Copy image">
      <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copy
    </button>
  </div>
</div>
